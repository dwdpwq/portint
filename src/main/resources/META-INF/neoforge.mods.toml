modLoader = "javafml"
loaderVersion = "[4,)"

license = "MIT"
issueTrackerURL = "https://github.com/dwdpwq/portint/issues"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/portint"

[[mods]]
modId = "portint"
version = "${file.jarVersion}"
displayName = "PortInt - Portable Interface"
authors = "Miracle_sever"
description = '''
PortInt adds a portable interface block to AE2 networks, enabling wireless cross-dimensional item, fluid, and chemical transfer.

Features:
- 9 independent columns, each with its own binding card and 27 filter slots
- Item / Fluid / Chemical (Mekanism) transport with no hard dependency
- Whitelist / Blacklist and Input / Output modes per column
- Upgrade slots: acceleration, range, dimension, and long cards (unlimited rate)
- Binding cards link to target containers via shift-right-click
- Real-time binding validation — automatically updates if target container is replaced
- JEI drag-and-drop ghost item support
- Bilingual UI (English / Chinese)

Requires Applied Energistics 2. Mekanism and JEI are optional.
'''
logoFile = "portint.png"

